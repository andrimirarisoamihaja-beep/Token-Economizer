name: Test Automatique Python

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  verification-code:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Active le cache automatique des dépendances

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install mypy pytest
          # Ou si vous avez un fichier requirements :
          # if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Exécution de mypy (Vérification des types)
        run: python -m mypy calcul.py

      - name: Exécution de pytest (Tests unitaires)
        run: python -m pytest